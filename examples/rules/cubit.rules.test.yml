# Unit tests for cubit.rules.yml. Run: promtool test rules examples/rules/cubit.rules.test.yml
rule_files:
  - cubit.rules.yml

evaluation_interval: 1m

tests:
  # 1 GB per hour is 24 GB a day: the workspace and the root both cross their lines.
  - interval: 1h
    input_series:
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli"}'
        values: '0+1e9x40'
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="libs-core"}'
        values: '5e9+0x40'
      - series: 'cubit_root_bytes{root="example-projects"}'
        values: '0+1e9x40'
      - series: 'cubit_scan_partial{root="example-projects"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="max_files_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 3h
        alertname: CubitWorkspaceGrowth
        exp_alerts: []
      - eval_time: 30h
        alertname: CubitWorkspaceGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              workspace: app-cli
            exp_annotations:
              summary: "Workspace app-cli in example-projects grew by more than 5 GB in 24h"
      - eval_time: 30h
        alertname: CubitRootGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
            exp_annotations:
              summary: "Root example-projects grew by more than 20 GB in 24h"

  # A root that fails for longer than 15m, and a scan that has gone quiet.
  - interval: 5m
    input_series:
      - series: 'cubit_scan_success{root="example-projects"}'
        values: '1 1 1 0x30'
      - series: 'cubit_scan_last_success_timestamp_seconds{root="example-projects"}'
        values: '0x40'
      - series: 'cubit_scan_partial{root="example-projects"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: CubitScanFailing
        exp_alerts: []
      - eval_time: 60m
        alertname: CubitScanFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
            exp_annotations:
              summary: "Cubit cannot measure root example-projects; sizes are the last good values"
      - eval_time: 30m
        alertname: CubitScanStale
        exp_alerts: []
      - eval_time: 130m
        alertname: CubitScanStale
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
            exp_annotations:
              summary: "Cubit has not measured root example-projects for over an hour"

  # A cap hit fires CubitScanPartial, and it stops firing an hour after the last one.
  - interval: 5m
    input_series:
      - series: 'cubit_scan_errors_total{root="example-projects",reason="deadline_exceeded"}'
        values: '0 0 0 1 1x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="max_files_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: CubitScanPartial
        exp_alerts: []
      - eval_time: 20m
        alertname: CubitScanPartial
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              reason: deadline_exceeded
            exp_annotations:
              summary: "Cubit scans of root example-projects hit a cap (deadline_exceeded); sizes are lower bounds"
      - eval_time: 2h30m
        alertname: CubitScanPartial
        exp_alerts: []

  # An unreadable subtree is not a cap hit: subtree_unreadable never fires CubitScanPartial,
  # however often it counts.
  - interval: 5m
    input_series:
      - series: 'cubit_scan_errors_total{root="example-projects",reason="subtree_unreadable"}'
        values: '0+1x60'
      - series: 'cubit_scan_partial{root="example-projects"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: CubitScanPartial
        exp_alerts: []

  # A persistently unreadable subtree fires CubitSubtreeUnreadable after 24h, per reason.
  - interval: 5m
    input_series:
      - series: 'cubit_skipped_entries{root="example-projects",reason="permission_denied"}'
        values: '2x340'
      - series: 'cubit_skipped_entries{root="example-projects",reason="io_error"}'
        values: '0x340'
      - series: 'cubit_skipped_entries{root="example-projects",reason="refused"}'
        values: '5x340'
    alert_rule_test:
      - eval_time: 12h
        alertname: CubitSubtreeUnreadable
        exp_alerts: []
      - eval_time: 26h
        alertname: CubitSubtreeUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              reason: permission_denied
            exp_annotations:
              summary: "Cubit cannot read 2 subtree(s) under root example-projects (permission_denied)"

  # A subtree that is unreadable for a while and then fixed does not fire.
  - interval: 5m
    input_series:
      - series: 'cubit_skipped_entries{root="example-projects",reason="io_error"}'
        values: '1x200 _x200'
    alert_rule_test:
      - eval_time: 30h
        alertname: CubitSubtreeUnreadable
        exp_alerts: []

  # A partial scan inside the window silences growth: the jump after it is not growth.
  - interval: 1h
    input_series:
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli"}'
        values: '0+1e9x40'
      - series: 'cubit_scan_partial{root="example-projects"}'
        values: '0x10 1 0x30'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="max_files_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: CubitWorkspaceGrowth
        exp_alerts: []

  # Hardlink dedupe overflowed for longer than 30m.
  - interval: 1m
    input_series:
      - series: 'cubit_skipped_entries{root="example-projects",reason="dedupe_overflow"}'
        values: '0 3x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: CubitDedupeOverflow
        exp_alerts: []
      - eval_time: 50m
        alertname: CubitDedupeOverflow
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              reason: dedupe_overflow
            exp_annotations:
              summary: "Cubit sizes for root example-projects may over-count hardlinks"

  # A root that stays partial still alerts on growth: its numbers are lower bounds
  # all the way through, so they compare fairly. CubitScanPartial flags the state.
  - interval: 1h
    input_series:
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli"}'
        values: '0+1e9x40'
      - series: 'cubit_root_bytes{root="example-projects"}'
        values: '0+1e9x40'
      - series: 'cubit_scan_partial{root="example-projects"}'
        values: '1x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="max_files_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: CubitWorkspaceGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              workspace: app-cli
            exp_annotations:
              summary: "Workspace app-cli in example-projects grew by more than 5 GB in 24h"
      - eval_time: 30h
        alertname: CubitRootGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
            exp_annotations:
              summary: "Root example-projects grew by more than 20 GB in 24h"

  # Root aliases are per host. Instance a flips to partial and is muted; instance b
  # has the same alias, stays complete and still alerts. Neither mutes the other.
  - interval: 1h
    input_series:
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli",instance="a"}'
        values: '0+1e9x40'
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli",instance="b"}'
        values: '0+1e9x40'
      - series: 'cubit_root_bytes{root="example-projects",instance="a"}'
        values: '0+1e9x40'
      - series: 'cubit_root_bytes{root="example-projects",instance="b"}'
        values: '0+1e9x40'
      - series: 'cubit_scan_partial{root="example-projects",instance="a"}'
        values: '0x10 1 0x30'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="a",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="a",reason="max_files_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_partial{root="example-projects",instance="b"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="b",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="b",reason="max_files_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: CubitWorkspaceGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              workspace: app-cli
              instance: b
            exp_annotations:
              summary: "Workspace app-cli in example-projects grew by more than 5 GB in 24h"
      - eval_time: 30h
        alertname: CubitRootGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              instance: b
            exp_annotations:
              summary: "Root example-projects grew by more than 20 GB in 24h"

  # And the reverse: instance a is the steady one, so only b (which flipped) is muted.
  - interval: 1h
    input_series:
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli",instance="a"}'
        values: '0+1e9x40'
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli",instance="b"}'
        values: '0+1e9x40'
      - series: 'cubit_scan_partial{root="example-projects",instance="a"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="a",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="a",reason="max_files_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_partial{root="example-projects",instance="b"}'
        values: '0x10 1 0x30'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="b",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="b",reason="max_files_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: CubitWorkspaceGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              workspace: app-cli
              instance: a
            exp_annotations:
              summary: "Workspace app-cli in example-projects grew by more than 5 GB in 24h"

  # A root truncated by a cap: bytes move with the cut, not with growth, and the
  # deadline counter keeps climbing, so growth stays quiet.
  - interval: 1h
    input_series:
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli"}'
        values: '0+1e9x40'
      - series: 'cubit_root_bytes{root="example-projects"}'
        values: '0+1e9x40'
      - series: 'cubit_scan_partial{root="example-projects"}'
        values: '1x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="deadline_exceeded"}'
        values: '0+1x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="max_files_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: CubitWorkspaceGrowth
        exp_alerts: []
      - eval_time: 30h
        alertname: CubitRootGrowth
        exp_alerts: []

  # A root that is partial only because of one stable unreadable subtree: its
  # errors counter climbs on subtree_unreadable, there is no cap hit, and real
  # growth still alerts.
  - interval: 1h
    input_series:
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli"}'
        values: '0+1e9x40'
      - series: 'cubit_root_bytes{root="example-projects"}'
        values: '0+1e9x40'
      - series: 'cubit_scan_partial{root="example-projects"}'
        values: '1x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="subtree_unreadable"}'
        values: '0+1x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",reason="max_files_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: CubitWorkspaceGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              workspace: app-cli
            exp_annotations:
              summary: "Workspace app-cli in example-projects grew by more than 5 GB in 24h"
      - eval_time: 30h
        alertname: CubitRootGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
            exp_annotations:
              summary: "Root example-projects grew by more than 20 GB in 24h"

  # One cap hit inside the window mutes growth for the window, per instance: the
  # other instance, with no cap hit, still alerts.
  - interval: 1h
    input_series:
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli",instance="a"}'
        values: '0+1e9x40'
      - series: 'cubit_workspace_target_bytes{root="example-projects",workspace="app-cli",instance="b"}'
        values: '0+1e9x40'
      - series: 'cubit_scan_partial{root="example-projects",instance="a"}'
        values: '1x40'
      - series: 'cubit_scan_partial{root="example-projects",instance="b"}'
        values: '1x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="a",reason="max_files_exceeded"}'
        values: '0x20 1x20'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="a",reason="deadline_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="b",reason="max_files_exceeded"}'
        values: '0x40'
      - series: 'cubit_scan_errors_total{root="example-projects",instance="b",reason="deadline_exceeded"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: CubitWorkspaceGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
              root: example-projects
              workspace: app-cli
              instance: b
            exp_annotations:
              summary: "Workspace app-cli in example-projects grew by more than 5 GB in 24h"
