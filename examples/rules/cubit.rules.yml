# Example Prometheus alerting rules for Cubit. Synthetic: copy and adapt.
#
# These rules are written for `cubit serve`. They use cubit_scan_errors_total,
# which a one-shot `scan --textfile-dir` file does not carry (counters are
# process-scoped); with cron mode, drop that counter guard and hold growth on
# `max_over_time(cubit_scan_partial[24h]) == 0` instead.
#
# Cubit measures and judges nothing. Thresholds belong here, in Prometheus.
# Every rule carries severity "warning": anything built on Cubit is a YELLOW
# signal and never a page. Match the label vocabulary of your own rule files
# before deploying.
groups:
  - name: cubit
    rules:
      # Disk growth, attributed. Fires per workspace so the alert names the culprit.
      # Two things make a delta meaningless, so growth stays quiet for 24h after
      # either. A partial scan reports a lower bound, and a complete scan after it
      # (or the reverse) looks like a jump: the guard is a change in
      # cubit_scan_partial. And a cap (deadline_exceeded, max_files_exceeded)
      # cuts a scan at a point that moves from scan to scan, so two capped scans
      # compare nothing: the guard is no cap hit in the window. A root that stays
      # partial for another reason, such as one stable unreadable subtree, still
      # alerts: lower bound against lower bound compares fairly, and
      # CubitSubtreeUnreadable flags the cause. The guards rely on the error
      # counters existing at 0 from the first scrape, which Cubit does. Matching
      # keeps `instance`, because root aliases are per host and one host's partial
      # must not mute another's.
      - alert: CubitWorkspaceGrowth
        expr: |
          delta(cubit_workspace_target_bytes[24h]) > 5e9
          and ignoring (workspace) changes(cubit_scan_partial[24h]) == 0
          and ignoring (workspace) sum without (reason) (increase(cubit_scan_errors_total{reason=~"deadline_exceeded|max_files_exceeded"}[24h])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Workspace {{ $labels.workspace }} in {{ $labels.root }} grew by more than 5 GB in 24h"

      # The same, for a whole root. Catches growth that is spread across
      # workspaces or sits in the unlabeled overflow.
      - alert: CubitRootGrowth
        expr: |
          delta(cubit_root_bytes[24h]) > 20e9
          and changes(cubit_scan_partial[24h]) == 0
          and sum without (reason) (increase(cubit_scan_errors_total{reason=~"deadline_exceeded|max_files_exceeded"}[24h])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Root {{ $labels.root }} grew by more than 20 GB in 24h"

      # A root that has stopped measuring. The size gauges keep their last good
      # values, so this is the only thing that says they are stale.
      - alert: CubitScanFailing
        expr: cubit_scan_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cubit cannot measure root {{ $labels.root }}; sizes are the last good values"

      - alert: CubitScanStale
        expr: time() - cubit_scan_last_success_timestamp_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cubit has not measured root {{ $labels.root }} for over an hour"

      # A cap cut a scan short: max_duration or max_files ran out, so every size is
      # a lower bound. This is the systematic-truncation signal. Raise the cap, or
      # narrow the root. An unreadable subtree does not fire it: see below.
      - alert: CubitScanPartial
        expr: increase(cubit_scan_errors_total{reason=~"deadline_exceeded|max_files_exceeded"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Cubit scans of root {{ $labels.root }} hit a cap ({{ $labels.reason }}); sizes are lower bounds"

      # A subtree Cubit cannot read, for a day. On a shared build host one such
      # directory (another user's, a sandbox) is permanent and harmless, so this
      # waits 24h and names the cause. Sizes stay honest lower bounds meanwhile.
      - alert: CubitSubtreeUnreadable
        expr: cubit_skipped_entries{reason=~"permission_denied|io_error"} > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "Cubit cannot read {{ $value }} subtree(s) under root {{ $labels.root }} ({{ $labels.reason }})"

      # The hardlink set filled, so later hardlinks may be counted twice.
      - alert: CubitDedupeOverflow
        expr: cubit_skipped_entries{reason="dedupe_overflow"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Cubit sizes for root {{ $labels.root }} may over-count hardlinks"
