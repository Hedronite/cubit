version: "2"

run:
  go: "1.26"
  tests: true

linters:
  settings:
    errcheck:
      # Closing a directory or root that was only read cannot lose data.
      exclude-functions:
        - (*os.File).Close
        - (*os.Root).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # Tests read fixtures by computed path, and build trees with best-effort
      # setup and cleanup calls whose failure the assertions would show anyway.
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Hedronite/cubit
