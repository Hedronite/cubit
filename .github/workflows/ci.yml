name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never fetch a newer toolchain: the matrix must test the Go it names.
  GOTOOLCHAIN: local

jobs:
  # Build, vet and test on stable and previous Go. The go.mod floor (1.26) is the
  # previous release today, so it is covered. Darwin is a primary leg, not a courtesy.
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # Architectures with no native runner are built, not tested.
  cross-build:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go build -trimpath ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  # Each fuzz target gets a 30 second smoke run on every change. Failing inputs
  # are written to testdata/fuzz and must be committed with the fix.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzContain, pkg: ./internal/contain }
          - { target: FuzzResolve, pkg: ./internal/contain }
          - { target: FuzzRefuse, pkg: ./internal/contain }
          - { target: FuzzConfigDecode, pkg: ./internal/config }
          - { target: FuzzLabel, pkg: ./internal/config }
          - { target: FuzzClassifyProfile, pkg: ./internal/walk }
          - { target: FuzzScanJSON, pkg: ./internal/scan }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s ${{ matrix.pkg }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The Prometheus rules ship as an example, so they are checked and unit-tested
  # with promtool on every change. The release archive is pinned by checksum.
  rules:
    runs-on: ubuntu-latest
    env:
      PROM_VERSION: 3.16.0
      PROM_SHA256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install promtool
        run: |
          set -euo pipefail
          archive="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${archive}"
          echo "${PROM_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          ./promtool --version
      - name: Check and test the example rules
        run: |
          ./promtool check rules examples/rules/cubit.rules.yml
          ./promtool test rules examples/rules/cubit.rules.test.yml
          ./promtool check rules examples/rules/cubit-cron.rules.yml
          ./promtool test rules examples/rules/cubit-cron.rules.test.yml
          ./promtool test rules testdata/vigil/queries.test.yml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # The exporter's own output, linted by the reference tool.
      - name: Lint /metrics from a live serve
        run: scripts/metrics-lint.sh "$PWD/promtool"

  # The release is reproducible: two clean builds of the commit under review, in
  # separate worktrees, give identical archives and checksums. A pull_request run
  # checks out the merge ref by default, which is a different commit from the one
  # being reviewed and would give different binaries, so the head SHA is checked
  # out explicitly. The Go release is the pinned one from scripts/release.env.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
      - run: scripts/reproduce.sh "$(git rev-parse HEAD)"

  # The repo is public: refuse real paths, addresses, hosts and contacts, and
  # scan the tree and its history for secrets.
  scrub:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scrub
        # A secret, so it is masked in logs. Only this step sees it. It is empty on
        # fork pull requests, where the scrub runs its built-in checks only.
        env:
          CUBIT_SCRUB_EXTRA: ${{ secrets.CUBIT_SCRUB_EXTRA }}
        run: scripts/scrub.sh
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Gitleaks (tree)
        run: ./gitleaks dir . --redact --no-banner
      - name: Gitleaks (history)
        run: ./gitleaks git . --redact --no-banner
